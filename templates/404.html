<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category Not Found</title>
<style>
  :root{
    --bg: #faf7f1;
    --ink: #262220;
    --muted: #948a7c;
    --accent: #a3392f;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    padding: 24px;
  }

  .wrap{
    text-align: center;
    max-width: 380px;
    animation: rise 0.5s ease-out;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .mark{
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
  }

  .mark::before,
  .mark::after{
    content: "";
    display: inline-block;
    width: 22px;
    height: 1px;
    background: var(--accent);
    vertical-align: middle;
    margin: 0 10px;
    opacity: 0.5;
  }

  h1{
    font-size: 28px;
    font-weight: 400;
    margin: 0 0 12px;
    line-height: 1.3;
  }

  p{
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 34px;
  }

  a.btn{
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--bg);
    background: var(--ink);
    padding: 12px 26px;
    border-radius: 2px;
    transition: opacity 0.15s ease;
  }

  a.btn:hover{
    opacity: 0.85;
  }

  @media (prefers-reduced-motion: reduce){
    .wrap{ animation: none; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="mark">404</div>
    <h1>Category does not exist</h1>
    <p>The category you're looking for isn't here.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>

</body>
</html>
